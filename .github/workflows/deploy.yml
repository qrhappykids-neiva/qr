name: Sync to Hugging Face
on:
  push:
    branches: [main]
  # Permite ejecutar manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        lfs: true

    - name: Push to Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        git push --force https://Happykidsneiva:$HF_TOKEN@huggingface.co/spaces/Happykidsneiva/qr main
